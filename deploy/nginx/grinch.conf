# ═══════════════════════════════════════════════════════════════════════════
#  /etc/nginx/sites-available/grinch   (install, then `certbot --nginx` or
#  `bash deploy/setup-tls.sh` to obtain the certificate)
#
#  Two fixes vs the config found on the VPS:
#    1. WebSocket upgrade headers for /socket.io/ — without them socket.io
#       silently degrades to HTTP long-polling (~10 requests/client/5 s).
#    2. TLS termination, so the admin login is not sent in cleartext.
# ═══════════════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 632969.senko.network 2.27.25.126;
    client_max_body_size 16m;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 632969.senko.network 2.27.25.126;
    client_max_body_size 16m;

    ssl_certificate     /etc/letsencrypt/live/632969.senko.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/632969.senko.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Socket.IO / WebSocket ───────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
