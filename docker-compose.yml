# ═══════════════════════════════════════════════════════════════════════════════
# AI-Trading — Standalone (single container, SQLite, no external deps)
# ═══════════════════════════════════════════════════════════════════════════════
# Quick start:  docker-compose up -d
# Build:        docker-compose build --parallel
# ═══════════════════════════════════════════════════════════════════════════════

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        pip-cache: /tmp/pip-cache
    # Tag by commit SHA so every deploy is identifiable and rollback-able.
    image: bot-bot:${GIT_SHA:-local}
    container_name: quantum-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_CONCURRENCY=1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data:rw
      - ./backups:/app/backups:rw
      - ./logs:/app/logs:rw
      # NOTE: meta_engine.py / meta_bridge.py / quantum_brain.py used to be
      # bind-mounted from the host. That made them invisible to `docker build`,
      # so a git pull mutated running code without any image rebuild. They are
      # now baked into the image (Dockerfile copies *.py at the repo root).
      - ./models:/app/models:ro
    networks:
      - grinch-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  grinch-net:
    driver: bridge
