# ═══════════════════════════════════════════════════════════════════════════════
# GRINCH-GRAM — Standalone (single container, SQLite, no external deps)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Quick start for development or simple VPS:
#   docker-compose up -d
#
# For production with PostgreSQL + Redis + Nginx, use:
#   docker-compose -f docker-compose.prod.yml up -d

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grinch-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - GUNICORN=true
      - WEB_CONCURRENCY=2
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:rw
      - ./backups:/app/backups:rw
      - ./logs:/app/logs:rw
      - ./models:/app/models:ro
    networks:
      - grinch-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  grinch-net:
    driver: bridge
