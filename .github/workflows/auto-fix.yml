name: Auto-Fix

# Replaces the previous stub that only copied a generated snippet into fixes/.
# It now applies real, mechanical fixes and escalates what it cannot fix.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-fix-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. On a same-repo PR: fix the branch in place ───────────────────────────
  fix-pr:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recursion guard
        id: guard
        run: |
          A=$(git log -1 --format='%an')
          echo "head_author=$A"
          if [ "$A" = "GRINCH Auto-Fix Bot" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fixers
        if: steps.guard.outputs.skip == 'false'
        run: pip install 'black==26.3.1' 'ruff==0.3.4'

      - name: Apply autofixes
        id: fix
        if: steps.guard.outputs.skip == 'false'
        run: |
          ruff check . --fix --exit-zero
          black . || true
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no mechanical fixes needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Push fixes to the PR branch
        if: steps.fix.outputs.changed == 'true'
        run: |
          git config user.name "GRINCH Auto-Fix Bot"
          git config user.email "auto-fix@grinch-gram.local"
          git add -A
          git commit -m "fix: apply automated ruff/black autofixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # ── 2. On a failed CI run on main: fix it, or escalate ─────────────────────
  fix-main:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixers
        run: pip install 'black==26.3.1' 'ruff==0.3.4'

      - name: Try mechanical fixes
        id: fix
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          ruff check . --fix --exit-zero
          black . || true
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open a fix PR
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.fix.outputs.sha }}"
          SHORT=$(echo "$SHA" | cut -c1-8)
          BR="auto-fix/ci-$SHORT"
          git config user.name "GRINCH Auto-Fix Bot"
          git config user.email "auto-fix@grinch-gram.local"
          git checkout -b "$BR"
          git add -A
          git commit -m "fix(ci): automated ruff/black fixes for failed CI on $SHORT"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "fix: automated autofixes for failed CI on $SHORT" \
            --body "Mechanical fixes produced by ruff --fix and black after CI failed on main at $SHA. Review the diff before merging."
          echo "Opened PR for $BR"

      - name: Escalate when nothing is mechanically fixable
        if: steps.fix.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.fix.outputs.sha }}"
          SHORT=$(echo "$SHA" | cut -c1-8)
          URL="${{ github.event.workflow_run.html_url }}"
          gh issue create \
            --title "[AUTO-BUG] CI failed on main @ $SHORT" \
            --label "auto-error" \
            --body "CI failed on main at commit $SHA and no mechanical fix (ruff/black) was available, so a real code change is required.

          Run: $URL
          Branch: main

          Labelled auto-error so the existing auto-fix chain and reviewers pick it up."
