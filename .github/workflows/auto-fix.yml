name: Auto-Fix v2

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: string

jobs:
  analyze-and-fix:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'auto-error') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai requests

      - name: Analyze error with Intelligence Engine
        id: fix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import json
          import openai
          
          sys.path.insert(0, ".")
          from autonomy.intelligence import get_intelligence
          
          issue_body = os.environ.get("ISSUE_BODY", "")
          if not issue_body:
              print("No issue body")
              exit(0)
          
          # Extract error info
          error_type_match = re.search(r'\*\*Error Type\*\*\s*\|\s*`([^`]+)`', issue_body)
          message_match = re.search(r'\*\*Message\*\*\s*\|\s*`([^`]+)`', issue_body)
          traceback_match = re.search(r'### Traceback\n```python\n(.*?)\n```', issue_body, re.DOTALL)
          file_match = re.search(r'\*\*File\*\*\s*\|\s*`([^`]+)`', issue_body)
          line_match = re.search(r'\*\*Line\*\*\s*\|\s*(\d+)', issue_body)
          
          error_type = error_type_match.group(1) if error_type_match else "Unknown"
          message = message_match.group(1) if message_match else ""
          traceback_text = traceback_match.group(1) if traceback_match else ""
          file_path = file_match.group(1) if file_match else ""
          line_num = int(line_match.group(1)) if line_match else 0
          
          # Use Intelligence Engine
          intel = get_intelligence()
          analysis = intel.analyze(error_type, message, traceback_text)
          
          if analysis:
              print(f"::set-output name=pattern::{analysis['pattern']}")
              print(f"::set-output name=confidence::{analysis['confidence']}")
              print(f"::set-output name=severity::{analysis['severity']}")
              
              # Generate fix
              fix_code = intel.generate_fix_code(analysis, file_path, line_num)
              
              with open("/tmp/fix_code.py", "w") as f:
                  f.write(fix_code)
              
              print("Fix generated successfully")
          else:
              # Fallback to OpenAI
              client = openai.OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))
              prompt = f"""Fix this Python error:
Error: {error_type}: {message}
File: {file_path}:{line_num}
Traceback: {traceback_text[:2000]}

Provide only the fixed code section."""
              
              response = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[{"role": "user", "content": prompt}],
                  temperature=0.1,
              )
              
              fix_code = response.choices[0].message.content
              with open("/tmp/fix_code.py", "w") as f:
                  f.write(fix_code)
              
              print("OpenAI fix generated")
          PYEOF

      - name: Apply fix and create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GRINCH Auto-Fix Bot"
          git config user.email "auto-fix@grinch-gram.local"
          
          BRANCH="auto-fix/issue-${{ github.event.issue.number || github.event.inputs.issue_number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          
          # Apply fix if file exists
          if [ -f /tmp/fix_code.py ]; then
              # Here you would integrate the fix into the actual file
              # For now, we create a patch file
              cp /tmp/fix_code.py "fixes/fix_${{ github.event.issue.number || github.event.inputs.issue_number }}.py"
              git add -A
              git commit -m "auto-fix: resolve issue #${{ github.event.issue.number || github.event.inputs.issue_number }}"
              git push origin "$BRANCH"
          fi
          
          # Create PR
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d "{
              \"title\": \"[AUTO-FIX] Resolve issue #${{ github.event.issue.number || github.event.inputs.issue_number }}\",
              \"body\": \"Automatically generated fix.\\n\\nPattern: ${{ steps.fix.outputs.pattern || 'unknown' }}\\nConfidence: ${{ steps.fix.outputs.confidence || 'N/A' }}\\nSeverity: ${{ steps.fix.outputs.severity || 'unknown' }}\",
              \"head\": \"$BRANCH\",
              \"base\": \"main\",
              \"labels\": [\"auto-fix\", \"bot\"]
            }"

      - name: Comment on issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments \
            -d "{
              \"body\": \"🤖 Auto-fix generated!\\n\\n- Pattern detected: ${{ steps.fix.outputs.pattern || 'unknown' }}\\n- Confidence: ${{ steps.fix.outputs.confidence || 'N/A' }}%\\n- Severity: ${{ steps.fix.outputs.severity || 'unknown' }}\\n\\nA pull request has been created with the proposed fix.\"
            }"
