name: Auto-Fix

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: string

jobs:
  analyze-and-fix:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'auto-error') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai requests

      - name: Analyze error and generate fix
        id: fix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import json
          import openai

          issue_body = os.environ.get("ISSUE_BODY", "")
          if not issue_body:
              print("No issue body found")
              exit(0)

          # Extract error info
          file_match = re.search(r'\*\*File\*\*\s*\|\s*`([^`]+)`', issue_body)
          line_match = re.search(r'\*\*Line\*\*\s*\|\s*(\d+)', issue_body)
          traceback_match = re.search(r'```python\n(.*?)\n```', issue_body, re.DOTALL)

          file_path = file_match.group(1) if file_match else "unknown"
          line_num = int(line_match.group(1)) if line_match else 0
          traceback_text = traceback_match.group(1) if traceback_match else ""

          print(f"File: {file_path}")
          print(f"Line: {line_num}")

          # Read the problematic file
          if os.path.exists(file_path):
              with open(file_path, 'r') as f:
                  code = f.read()
          else:
              print(f"File not found: {file_path}")
              exit(0)

          # Use OpenAI to generate fix
          client = openai.OpenAI(api_key=os.environ.get("OPENAI_API_KEY"))
          
          prompt = f"""You are a Python expert. Fix the error in this code.

Error traceback:
{traceback_text}

File: {file_path}
Line: {line_num}

Code:
```python
{code}
```

Provide ONLY the fixed code. Do not include explanations."""

          response = client.chat.completions.create(
              model="gpt-4o-mini",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.1,
          )

          fixed_code = response.choices[0].message.content
          # Extract code from markdown
          code_match = re.search(r'```python\n(.*?)\n```', fixed_code, re.DOTALL)
          if code_match:
              fixed_code = code_match.group(1)

          with open(file_path, 'w') as f:
              f.write(fixed_code)

          print("Fix applied successfully")
          PYEOF

      - name: Create fix branch and PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "Auto-Fix Bot"
          git config user.email "auto-fix@grinch-gram.local"
          
          BRANCH="auto-fix/issue-${{ github.event.issue.number || github.event.inputs.issue_number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "auto-fix: resolve issue #${{ github.event.issue.number || github.event.inputs.issue_number }}"
          git push origin "$BRANCH"
          
          # Create PR
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d "{
              \"title\": \"[AUTO-FIX] Resolve issue #${{ github.event.issue.number || github.event.inputs.issue_number }}\",
              \"body\": \"Automatically generated fix for issue #${{ github.event.issue.number || github.event.inputs.issue_number }}\",
              \"head\": \"$BRANCH\",
              \"base\": \"main\",
              \"labels\": [\"auto-fix\", \"bot\"]
            }"
