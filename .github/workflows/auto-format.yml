name: Auto-Format

# Previously this ran on every push to any non-main branch, which is how stale,
# already-merged branches kept receiving bot commits. It is now manual-only:
# PR formatting is handled by the Auto-Fix workflow, which guards against
# recursion and only ever touches the branch of the PR it was triggered by.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters
        run: pip install 'black==26.3.1' 'ruff==0.3.4'

      - name: Auto-format with black
        run: black .

      - name: Auto-fix with ruff
        run: ruff check . --fix --exit-zero

      - name: Commit fixes
        run: |
          git config user.name "GRINCH Auto-Format Bot"
          git config user.email "auto-format@grinch-gram.local"
          if [ -n "$(git status --short)" ]; then
            git add -A
            git commit -m "style: auto-format with black + ruff" || true
            git push
          fi
