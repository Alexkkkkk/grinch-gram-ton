name: Auto-Format

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatters
        run: pip install black ruff

      - name: Auto-format with black
        run: black .

      - name: Auto-fix with ruff
        run: ruff check . --fix --exit-zero

      - name: Commit fixes
        run: |
          git config user.name "GRINCH Auto-Format Bot"
          git config user.email "auto-format@grinch-gram.local"
          if [ -n "$(git status --short)" ]; then
            git add -A
            git commit -m "style: auto-format with black + ruff" || true
            git push
          fi
