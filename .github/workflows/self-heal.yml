name: Self-Heal Check

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS Health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 2.27.25.126
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: 22
          script: |
            echo "=== VPS Health Check ==="
            
            # Check bot health
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            echo "Bot health: $HEALTH"
            
            # Check Docker
            docker ps --filter "name=grinch" --format "{{.Names}}: {{.Status}}"
            
            # Check resources
            echo "Memory:"
            free -h | grep Mem
            echo "Disk:"
            df -h / | tail -1
            echo "CPU load:"
            uptime
            
            # Auto-heal if needed
            if [ "$HEALTH" != "200" ]; then
              echo "Bot unhealthy! Attempting heal..."
              cd /opt/bot && docker-compose restart bot
              sleep 10
              NEW_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
              echo "After heal: $NEW_HEALTH"
            fi

      - name: Report to GitHub
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{
              \"title\": \"[ALERT] VPS Health Check Failed $(date -u +%Y-%m-%d_%H:%M)\",
              \"body\": \"VPS health check failed.\\n\\n- Host: ${{ secrets.VPS_HOST }}\\n- Time: $(date -u)\\n\\nPlease investigate.\",
              \"labels\": [\"alert\", \"vps\", \"auto-error\"]
            }"
