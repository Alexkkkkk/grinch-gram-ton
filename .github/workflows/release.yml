name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "Changes since $LATEST_TAG:"
            git log "$LATEST_TAG"..HEAD --oneline --no-decorate | head -50
          else
            echo "First release"
            git log --oneline --no-decorate | head -50
          fi > /tmp/changelog.txt
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: true
