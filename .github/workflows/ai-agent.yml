name: AI Agent (Claude)

# AI-агент:
#  - отвечает на "@claude" в комментариях к issues/PR,
#  - чинит баги по метке `ai-fix`,
#  - автоматически исправляет упавший CI на main и открывает fix-PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: ai-agent-${{ github.event.issue.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  claude-assist:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: AI agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          trigger_phrase: '@claude'
          claude_args: |
            --allowed-tools "Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(python:*),Read,Edit,Write,Glob,Grep"

  fix-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Fix CI failure and open PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          prompt: |
            CI на ветке main упал (код этого коммита уже в checkout).
            Порядок действий:
            1. Найди причину падения: `gh run view ${{ github.event.workflow_run.id }} --log-failed`
               (GH_TOKEN уже в окружении).
            2. Исправь баг минимальным изменением кода. НЕ правь CI-конфиг,
               чтобы просто «позеленить» сборку.
            3. Проверь локально: python -m py_compile по изменённым файлам,
               `ruff check .`, `pytest` (если падали тесты).
            4. Создай ветку `ai-fix/ci-$(date +%s)`, закоммить изменения
               и открой PR в main с описанием: причина падения + суть фикса.
            ВАЖНО: ничего не пуши в main напрямую — только через PR.
          claude_args: |
            --allowed-tools "Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(python:*),Read,Edit,Write,Glob,Grep"
            --max-turns 40
