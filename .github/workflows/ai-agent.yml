name: AI Agent

# Приоритет AI-провайдеров (по наличию секретов):
#   1. XAI_API_KEY  -> Grok (api.x.ai, модель grok-4.6)  — ОСНОВНОЙ
#   2. ANTHROPIC_API_KEY -> Claude (агентный режим claude-code-action)
#   3. OPENAI_API_KEY -> OpenAI gpt-4o-mini
# Триггеры: "@grok" или "@claude" в комментарии, метка ai-fix на issue,
# упавший CI на main.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: ai-agent-${{ github.event.issue.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.keys.outputs.provider }}
      ci_failed: ${{ steps.ci.outputs.failed }}
      run_id: ${{ steps.ci.outputs.run_id }}
      is_mention: ${{ steps.trg.outputs.mention }}
      is_label: ${{ steps.trg.outputs.label }}
    steps:
      - id: keys
        env:
          X: ${{ secrets.XAI_API_KEY }}
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          O: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$X" ]; then echo "provider=xai" >> "$GITHUB_OUTPUT"
          elif [ -n "$A" ]; then echo "provider=claude" >> "$GITHUB_OUTPUT"
          elif [ -n "$O" ]; then echo "provider=openai" >> "$GITHUB_OUTPUT"
          else echo "provider=none" >> "$GITHUB_OUTPUT"; fi
      - id: trg
        env:
          BODY: ${{ github.event.comment.body || '' }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name || '' }}
        run: |
          M=no; L=no
          case "$BODY" in *"@grok"*|*"@claude"*) M=yes;; esac
          if [ "$EVENT" = "issues" ] && [ "$LABEL" = "ai-fix" ]; then L=yes; fi
          echo "mention=$M" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
      - id: ci
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" = "failure" ] && [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "failed=yes" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "failed=no" >> "$GITHUB_OUTPUT"
          fi

  # ---------- Claude (fallback #1): агентный режим, умеет сам править код ----------
  claude-agent:
    needs: detect
    if: >-
      needs.detect.outputs.provider == 'claude' &&
      (needs.detect.outputs.is_mention == 'yes' || needs.detect.outputs.is_label == 'yes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          trigger_phrase: '@claude'
          claude_args: |
            --allowed-tools "Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(python:*),Read,Edit,Write,Glob,Grep"

  # ---------- Grok / OpenAI: ответ в issue/PR (@grok или @claude) ----------
  chat-assist:
    needs: detect
    if: >-
      needs.detect.outputs.provider != 'claude' &&
      needs.detect.outputs.provider != 'none' &&
      needs.detect.outputs.is_mention == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ответ через AI
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ needs.detect.outputs.provider }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # Настройки провайдера: base URL и модель
          if [ "$PROVIDER" = "xai" ]; then
            export AI_BASE="https://api.x.ai/v1/chat/completions" AI_MODEL="grok-4.6" AI_NAME="Grok (xAI)"
          else
            export AI_BASE="https://api.openai.com/v1/chat/completions" AI_MODEL="gpt-4o-mini" AI_NAME="OpenAI"
          fi
          {
            echo "## Заголовок"
            gh api "repos/$REPO/issues/$NUM" --jq '.title' || true
            echo "## Текст"
            gh api "repos/$REPO/issues/$NUM" --jq '.body' || true
            echo "## Комментарии"
            gh api "repos/$REPO/issues/$NUM/comments" --jq '.[] | "- **" + .user.login + "**: " + .body' || true
          } > /tmp/context.md
          if gh api "repos/$REPO/pulls/$NUM" >/dev/null 2>&1; then
            echo "" >> /tmp/context.md
            echo "## Дифф PR (обрезан до 8000 символов)" >> /tmp/context.md
            gh pr diff "$NUM" --repo "$REPO" | head -c 8000 >> /tmp/context.md || true
          fi
          python3 - <<'PYEOF'
          import json, os, urllib.request
          ctx = open('/tmp/context.md', encoding='utf-8').read()[:60000]
          body = {
              "model": os.environ["AI_MODEL"],
              "messages": [
                  {"role": "system", "content": "Ты ИИ-инженер репозитория grinch-gram-ton — Python-бота спотовой grid-торговли на TON/DeDust. Отвечай по-русски, кратко и по делу: анализируй вопрос/баг и предлагай конкретные правки кода."},
                  {"role": "user", "content": ctx},
              ],
              "max_tokens": 2000,
          }
          req = urllib.request.Request(
              os.environ["AI_BASE"],
              data=json.dumps(body).encode(),
              headers={"Authorization": "Bearer " + os.environ.get("XAI_API_KEY") or os.environ.get("OPENAI_API_KEY", ""),
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=180) as resp:
              r = json.load(resp)
          answer = r["choices"][0]["message"]["content"]
          open("/tmp/answer.md", "w", encoding="utf-8").write(
              "🤖 **AI-ассистент (" + os.environ["AI_NAME"] + "):**\n\n" + answer)
          PYEOF
          [ -f /tmp/answer.md ] || echo "🤖 Ошибка вызова AI — проверь секреты XAI_API_KEY / OPENAI_API_KEY." > /tmp/answer.md
          gh issue comment "$NUM" --repo "$REPO" --body-file /tmp/answer.md

  # ---------- Claude (fallback #1): агентный фикс упавшего CI ----------
  claude-fix-ci:
    needs: detect
    if: >-
      needs.detect.outputs.provider == 'claude' &&
      needs.detect.outputs.ci_failed == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          prompt: |
            CI на ветке main упал (код этого коммита уже в checkout).
            Порядок действий:
            1. Найди причину падения: gh run view ${{ needs.detect.outputs.run_id }} --log-failed
            2. Исправь баг минимальным изменением кода. НЕ правь CI-конфиг, чтобы просто «позеленить» сборку.
            3. Проверь локально: python -m py_compile по изменённым файлам, ruff check ., pytest (если падали тесты).
            4. Создай ветку ai-fix/ci-$(date +%s), закоммить и открой PR в main: причина падения + суть фикса.
            ВАЖНО: ничего не пуши в main напрямую — только через PR.
          claude_args: |
            --allowed-tools "Bash(gh:*),Bash(git:*),Bash(pip:*),Bash(python:*),Read,Edit,Write,Glob,Grep"
            --max-turns 40

  # ---------- Grok / OpenAI: авто-фикс упавшего CI на main ИЛИ issue с меткой ai-fix ----------
  autofix:
    needs: detect
    if: >-
      needs.detect.outputs.provider != 'claude' &&
      needs.detect.outputs.provider != 'none' &&
      (needs.detect.outputs.ci_failed == 'yes' || needs.detect.outputs.is_label == 'yes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
      - name: AI-фикс и PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ needs.detect.outputs.provider }}
          RUN_ID: ${{ needs.detect.outputs.run_id }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$PROVIDER" = "xai" ]; then
            export AI_BASE="https://api.x.ai/v1/chat/completions" AI_MODEL="grok-4.6" AI_NAME="Grok (xAI)"
          else
            export AI_BASE="https://api.openai.com/v1/chat/completions" AI_MODEL="gpt-4o-mini" AI_NAME="OpenAI"
          fi
          # Защита от цикла: не больше одного открытого ai-fix PR одновременно
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^ai-fix/'; then
            echo "Уже есть открытый ai-fix PR — пропускаю"; exit 0
          fi
          if [ -n "$ISSUE_NUM" ]; then
            # Режим: issue с меткой ai-fix — контекст из issue
            {
              echo "ЗАДАЧА ИЗ ISSUE #$ISSUE_NUM:"
              gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.title'
              gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.body'
              echo; echo "КОММЕНТАРИИ:"
              gh api "repos/$REPO/issues/$ISSUE_NUM/comments" --jq '.[] | "- " + .body'
            } > /tmp/task.md
            echo "SOURCE=issue" >> "$GITHUB_ENV"
          else
            # Режим: упавший CI на main — контекст из лога падения
            gh run view "$RUN_ID" --log-failed 2>/dev/null | tail -c 40000 > /tmp/task.md
            echo "SOURCE=ci" >> "$GITHUB_ENV"
          fi
          CHANGED=$(git show --name-only --format= HEAD | head -50)
          export CHANGED
          python3 - <<'PYEOF'
          import json, os, subprocess, sys, urllib.request

          def sh(cmd):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True)

          task = open('/tmp/task.md', encoding='utf-8', errors='replace').read()[:40000]
          changed = os.environ.get("CHANGED", "")
          sha = sh("git rev-parse --short HEAD").stdout.strip()

          prompt = (
              "Репозиторий grinch-gram-ton (Python, спотовая grid-торговля TON/DeDust). "
              "Ниже — задача (упавший CI или баг из issue) и файлы последнего коммита.\n"
              "Верни СТРОГО один JSON-объект без markdown и текста вокруг:\n"
              '{"files": [{"path": "путь/файла.py", "content": "полное новое содержимое файла"}],'
              ' "explanation": "краткое объяснение причины и фикса по-русски",'
              ' "confidence": "high" или "low"}\n'
              "Правь минимально, только суть бага. Конфиги CI не трогай. "
              "Если не уверена — files: [] и confidence: low.\n\n"
              "ЗАДАЧА:\n" + task + "\n\nФАЙЛЫ ПОСЛЕДНЕГО КОММИТА:\n" + changed
          )
          key = os.environ.get("XAI_API_KEY") or os.environ.get("OPENAI_API_KEY", "")
          body = {"model": os.environ["AI_MODEL"],
                  "messages": [{"role": "user", "content": prompt}],
                  "temperature": 0.1, "max_tokens": 8000}
          req = urllib.request.Request(
              os.environ["AI_BASE"],
              data=json.dumps(body).encode(),
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=300) as resp:
                  text = json.load(resp)["choices"][0]["message"]["content"].strip()
          except Exception as e:
              open("/tmp/ai_expl.md", "w").write("Ошибка вызова AI (" + os.environ["AI_NAME"] + "): %s" % e)
              sys.exit(2)
          if text.startswith("```"):
              text = text.strip("`")
              if text.startswith("json"):
                  text = text[4:]
              text = text.strip()
          try:
              data = json.loads(text)
          except Exception as e:
              open("/tmp/ai_expl.md", "w").write("AI вернул нечитаемый ответ: %s" % e)
              sys.exit(2)
          expl = str(data.get("explanation", ""))
          open("/tmp/ai_expl.md", "w").write(
              "## AI-разбор (" + os.environ["AI_NAME"] + ")\n\n" + expl + "\n\nКоммит с багом: " + sha)
          files = data.get("files") or []
          if data.get("confidence") != "high" or not files:
              sys.exit(2)
          ok_paths = []
          for f in files:
              p = os.path.normpath(str(f.get("path", "")))
              if not p or p.startswith("..") or p.startswith("/") or "/.github/workflows" in p:
                  continue
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
              with open(p, "w", encoding="utf-8") as fh:
                  fh.write(str(f.get("content", "")))
              ok_paths.append(p)
          if not ok_paths:
              sys.exit(2)
          open("/tmp/changed.txt", "w").write("\n".join(ok_paths))
          PYEOF
          if [ $? -ne 0 ]; then
            echo "AI не дал уверенного фикса — создаю issue для ручного разбора"
            gh issue create --title "AI: не удалось авто-исправить ($(git rev-parse --short HEAD)) — нужен ручной фикс" \
              --body "$(cat /tmp/ai_expl.md 2>/dev/null || echo 'нет данных')" || true
            exit 0
          fi
          FAIL=0
          while read -r f; do
            case "$f" in
              *.py) python3 -m py_compile "$f" || FAIL=1 ;;
            esac
          done < /tmp/changed.txt
          if [ "$FAIL" = "1" ]; then
            echo "Фикс не компилируется — PR не открываю"; exit 0
          fi
          BR="ai-fix/$( [ "$SOURCE" = "issue" ] && echo "issue-$ISSUE_NUM" || echo "ci-$(git rev-parse --short HEAD)")-$(date +%H%M%S)"
          git checkout -b "$BR"
          git config user.name "ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: AI auto-fix ($AI_NAME)"
          git push origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "AI fix: $( [ "$SOURCE" = "issue" ] && echo "issue #$ISSUE_NUM" || echo "упавший CI на $(git rev-parse --short HEAD)")" \
            --body-file /tmp/ai_expl.md
