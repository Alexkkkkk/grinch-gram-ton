name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov black ruff mypy bandit

      - name: Check Python syntax
        run: find . -name "*.py" -not -path "./.git/*" -exec python3 -m py_compile {} \;

      - name: Check YAML syntax
        run: |
          pip install pyyaml
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('YAML OK')"

      - name: Lint with ruff
        run: ruff check . --output-format=github || true

      - name: Format check with black
        run: black --check .

      - name: Type check with mypy
        run: mypy core/ ai/ trading/ web/ db/ --ignore-missing-imports || true

      - name: Security scan with bandit
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml || true
