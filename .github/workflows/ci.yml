name: CI

on:
  push:
    branches: [ main, optimize/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov black ruff mypy bandit safety

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Format check with black
        run: black --check .

      - name: Type check with mypy
        run: mypy core/ ai/ trading/ web/ db/ --ignore-missing-imports || true

      - name: Security scan with bandit
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Dependency safety check
        run: safety check || true

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
