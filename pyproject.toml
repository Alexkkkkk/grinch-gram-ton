[project]
name = "grinch-gram"
version = "3.1.0"
description = "GRINCH/TON DeDust Spot Grid Trading Bot with AI Advisor"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1.3,<4",
    "flask-socketio>=5.6.1,<6",
    "flask-sqlalchemy>=3.1.1,<4",
    "flask-compress>=1.24,<2",
    "gunicorn>=23.0.0,<24",
    "orjson>=3.12.0,<4",
    "psycopg2-binary>=2.9.12,<3",
    "sqlalchemy>=2.0.52,<3",
    "numpy>=1.26.4,<2",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.5.2,<2",
    "joblib>=1.5.3,<2",
    "pytoniq>=0.1.43,<0.2",
    "pytoniq-core>=0.2.0,<0.3",
    "dedust>=1.1.4,<2",
    "cryptography>=50.0.0,<51",
    "requests>=2.32.0,<3",
    "python-dotenv>=1.2.3,<2",
    "openai>=1.109.1,<2",
    "email-validator>=2.3.0,<3",
    "apscheduler>=3.11.3,<4",
    "psutil>=7.2.2,<8",
    "Flask-Limiter>=4.1.1,<5",
    "pydantic>=2.13.4,<3",
    "cachetools>=5.3.0,<8",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1.4,<3", "lightgbm>=4.7.0,<5", "catboost>=1.2.10,<2", "joblib>=1.5.3,<2"]
ta = ["ta>=0.11.0,<1", "ccxt>=4.5.73,<5"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C4"]
ignore = ["E501", "E741", "C408", "E722", "E712", "F841"]
exclude = ["attached_assets", "backups", "data", ".git", "__pycache__"]
