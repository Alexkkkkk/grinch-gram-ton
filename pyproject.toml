[project]
name = "grinch-gram"
version = "2.0.0"
description = "GRINCH/TON DeDust Spot Grid Trading Bot"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "flask-socketio>=5.6.1,<6",
    "flask-sqlalchemy>=3.1.1,<4",
    "flask-compress>=1.24,<2",
    "gunicorn>=23.0.0,<24",
    "orjson>=3.11.9,<4",
    "psycopg2-binary>=2.9.12,<3",
    "sqlalchemy>=2.0.52,<3",
    "numpy>=1.26.4,<2",
    "pandas>=2.2.0,<3",
    "scikit-learn>=1.9.0,<2",
    "pytoniq>=0.1.43,<0.2",
    "pytoniq-core>=0.2.0,<0.3",
    "dedust>=1.1.4,<2",
    "cryptography>=50.0.0,<51",
    "aiohttp>=3.14.3,<4",
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.2,<2",
    "python-telegram-bot>=21.11.1,<23",
    "apscheduler>=3.11.3,<4",
    "psutil>=7.2.2,<8",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1.4,<3", "lightgbm>=4.7.0,<5", "catboost>=1.2.10,<2", "joblib>=1.5.3,<2"]
ta = ["ta>=0.11.0,<1", "ccxt>=4.5.73,<5"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
extend-exclude = ["attached_assets", "backups", "data", ".git", "__pycache__"]
