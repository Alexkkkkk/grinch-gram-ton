# ═══════════════════════════════════════════════════════════════════════════════# Nginx reverse proxy — HTTP/2, Brotli, Gzip, aggressive caching# ═══════════════════════════════════════════════════════════════════════════════user nginx;worker_processes auto;error_log /var/log/nginx/error.log warn;pid /var/run/nginx.pid;events {    worker_connections 4096;    use epoll;    multi_accept on;}http {    include /etc/nginx/mime.types;    default_type application/octet-stream;    # ── Performance ─────────────────────────────────────────────────────────────    sendfile on;    tcp_nopush on;    tcp_nodelay on;    keepalive_timeout 65;    keepalive_requests 1000;    types_hash_max_size 2048;    client_max_body_size 16M;    # ── Brotli + Gzip ───────────────────────────────────────────────────────────    # Brotli (better than gzip)    brotli on;    brotli_comp_level 6;    brotli_types text/plain text/css application/javascript application/json application/xml text/xml application/rss+xml text/javascript image/svg+xml;    # Gzip fallback    gzip on;    gzip_vary on;    gzip_proxied any;    gzip_comp_level 6;    gzip_types text/plain text/css application/javascript application/json application/xml text/xml application/rss+xml text/javascript image/svg+xml;    # ── Rate limiting ───────────────────────────────────────────────────────────    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;    # ── Upstream (Gunicorn) ─────────────────────────────────────────────────────    upstream app {        server bot:3000;        keepalive 64;    }    # ── Server ──────────────────────────────────────────────────────────────────    server {        listen 80;        listen [::]:80;        # HTTP/2 (if SSL is added later)        # listen 443 ssl http2;        server_name _;        # ── Security headers ──────────────────────────────────────────────────────        add_header X-Frame-Options SAMEORIGIN always;        add_header X-Content-Type-Options nosniff always;        add_header X-XSS-Protection 1; mode=block always;        add_header Referrer-Policy strict-origin-when-cross-origin always;        # ── Static files (aggressive cache) ───────────────────────────────────────        location ~* ^/static/ {            root /app;            expires 1y;            add_header Cache-Control public;            add_header Vary Accept-Encoding;            access_log off;            # Try brotli first, then gzip, then plain            try_files $uri $uri.br $uri.gz =404;        }        # ── API rate limiting ─────────────────────────────────────────────────────        location /api/ {            limit_req zone=api burst=100 nodelay;            proxy_pass http://app;            proxy_http_version 1.1;            proxy_set_header Connection keep-alive;            proxy_set_header Host $host;            proxy_set_header X-Real-IP $remote_addr;            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;            proxy_set_header X-Forwarded-Proto $scheme;            proxy_buffering on;            proxy_buffer_size 4k;            proxy_buffers 8 4k;            proxy_cache_bypass $http_upgrade;            proxy_read_timeout 30s;            proxy_connect_timeout 5s;            proxy_send_timeout 30s;        }        # ── Login rate limiting ───────────────────────────────────────────────────        location /login {            limit_req zone=login burst=5 nodelay;            proxy_pass http://app;            proxy_http_version 1.1;            proxy_set_header Connection keep-alive;            proxy_set_header Host $host;            proxy_set_header X-Real-IP $remote_addr;            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;            proxy_set_header X-Forwarded-Proto $scheme;        }        # ── Everything else ───────────────────────────────────────────────────────        location / {            proxy_pass http://app;            proxy_http_version 1.1;            proxy_set_header Connection keep-alive;            proxy_set_header Host $host;            proxy_set_header X-Real-IP $remote_addr;            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;            proxy_set_header X-Forwarded-Proto $scheme;            proxy_buffering on;            proxy_buffer_size 4k;            proxy_buffers 8 4k;            proxy_read_timeout 30s;        }    }}